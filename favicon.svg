<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Rounded shield background -->
  <path d="M32 4 C44 4 54 8 54 18 C54 36 38 52 32 60 C26 52 10 36 10 18 C10 8 20 4 32 4 Z" fill="url(#shieldGrad)" stroke="#D4AF37" stroke-width="2"/>
  <!-- Inner protective glow -->
  <path d="M32 8 C41 8 49 11 49 20 C49 34 37 47 32 54 C27 47 15 34 15 20 C15 11 23 8 32 8 Z" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <!-- Shepherd's Crook (Cross + Staff) -->
  <!-- Vertical staff -->
  <path d="M32 20 L32 46" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Crook curve at top right -->
  <path d="M32 20 C32 15 39 14 39 18 C39 22 36 24 33 24" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cross horizontal bar -->
  <path d="M25 28 L39 28" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>